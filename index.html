const tgTexto = () => E.tg === 'ok' ? 'Alerta enviado pelo Telegram ao seu responsável.' : E.tg === 'enviando' ? 'Enviando alerta pelo Telegram…' : E.tg === 'falha' ? 'Não consegui enviar o alerta pelo Telegram.' : 'Nenhum responsável cadastrado no Telegram.';

/** Manda o alerta pelo bot. Roda ao mesmo tempo em que o discador abre; nunca atrasa nem bloqueia a ligação. */
async function emgAlertaTelegram() {
  E.tg = 'enviando';
  const v = store.get('vinc');
  if (!v || !v.uid || !(v.contatos || []).length || !API()) { E.tg = 'sem'; return; }
  try {
    const n = S.nav, sim = emgSim();
    let pos = null;
    if (!sim && S.geoOK) { try { pos = await getPos(4000); } catch (e) { pos = S.lastPos0 || null; } }
    const body = { uid: v.uid, simulacao: sim, parada: n && STOPS[n.idx] ? nm(STOPS[n.idx]) : (S.lastSimStop ? nm(S.lastSimStop) : ''), destino: n && n.dest ? nm(n.dest) : '' };
    if (pos) { body.lat = pos.lat; body.lng = pos.lng; body.precisao = pos.accuracy; }
    const r = await api('/alerta', { method: 'POST', body, timeout: 8000 });
    E.tg = (r.dados && r.dados.enviados > 0) || (r.erro === 'http' && r.status === 429) ? 'ok' : 'falha'; /* 429 = já enviado no último minuto */

/* ---------- paradas: reconhecimento inteligente (módulo do arquivo mestre linha875c10.js) ---------- */
const NAO_ENTENDI = 'Não entendi. Você pode falar a rua, o bairro, um metrô próximo ou um ponto de referência?';
const listaFalada = ps => ps.length < 2 ? ps.map(nm).join('') : ps.slice(0, -1).map(nm).join(', ') + ' ou ' + nm(ps[ps.length - 1]);
/** Pergunta uma parada e resolve tudo por voz: entende apelido, rua, número, bairro, metrô, hospital…; confirma quando em dúvida; pergunta qual quando há várias. */
async function askStop(prompt, label, view) {
  const parse = (n, raw) => { const x = reconhecerParada(raw || n); return x.tipo === 'nenhuma' ? { retry: NAO_ENTENDI } : x; };
  let r = await ask(prompt, parse, { again: label, view: view || 'listen' });
  for (;;) {
    if (r.tipo === 'direta') return r.parada;
    if (r.tipo === 'confirmar') {
      const yes = await ask('Você quis dizer ' + nm(r.parada) + '? Diga sim ou não.', yn, { noGlobal: true });
      if (yes) return r.parada;
      r = await ask(label, parse, { again: label, view: view || 'listen' }); continue;
    }
    if (r.tipo === 'ambigua') {
      const lista = r.paradas;
      const pergunta = lista.length <= 6
        ? 'Encontrei várias paradas. Você quer a parada ' + listaFalada(lista) + '?'
        : 'Encontrei ' + lista.length + ' paradas. Elas vão de ' + nm(lista[0]) + ' até ' + nm(lista[lista.length - 1]) + '. Diga o nome da rua, o número do endereço ou um ponto de referência.'; /* lista longa: resume, para não cansar quem está ouvindo */
      return await ask(pergunta, (n, raw) => escolherEntre(raw || n, lista) || undefined, { again: 'Diga o nome, o número do endereço ou o número da parada.', noGlobal: true });
    }
    r = await ask(label, parse, { again: label, view: view || 'listen' });
  }
}

/* ---------- geometria ---------- */
function dist(a, b) { const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng), h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const fmtD = m => m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' quilômetros' : Math.max(10, Math.round(m / 10) * 10) + ' metros';
function nearest(pos, from, to) { let b = null; for (let i = from; i <= to; i++) { const d = dist(pos, STOPS[i]); if (!b || d < b.d) b = { i, d, s: STOPS[i] }; } return b; }

/* ---------- planejar viagem ---------- */
async function planTrip(first) {
  let prompt = first || 'Para onde você deseja ir?';
  for (;;) {
    const dest = await askStop(prompt, 'Para onde você deseja ir?'); prompt = 'Para onde você deseja ir?';
    if (dest.id === 1) { await speak('O Terminal Lapa é o ponto inicial da linha. Só tenho o sentido Terminal Lapa para Metrô Santa Cruz. Escolha outro destino.'); continue; }
    let origin = null, walk = false; const askOrigin = () => askStop('Onde você está agora?', 'Onde você está agora?');
    if (S.sim) origin = await askOrigin();
    else {
      await speak('Estou identificando sua localização.');
      let pos = null; try { pos = await getPos(20000); S.geoOK = true; S.lastPos0 = pos; } catch (e) {}
      if (!pos) { if (await offerSim()) origin = await askOrigin(); else continue; }
      else {
        const nr = nearest(pos, 0, Math.max(0, dest.id - 2));
        if (nr.d > 100) { /* não está no ponto (mais de 100 m): pergunta se segue no funcionamento normal ou na simulação */
          const far = nr.d > 2500;
          const choice = await ask((far ? 'Você está a ' + fmtD(nr.d) + ' da linha 875C-10.' : 'Você não está no ponto. A parada mais próxima é ' + nm(nr.s) + ', a ' + fmtD(nr.d) + '.') + ' Quer seguir no funcionamento normal ou usar a simulação? Diga normal ou simulação.',
            n => /\b(simula\w*|teste)\b/.test(n) ? 'sim' : /\b(normal|real|gps|seguir|funcionamento)\b/.test(n) ? 'normal' : (RE_ESTOU.test(n) && (paradaFalada(n, pos).stop)) ? { fala: n } : undefined, { noGlobal: true, again: 'Diga normal ou simulação, ou diga em que parada você está.' });
          if (choice && choice.fala) { /* você disse onde está: confere com o GPS */
            const sp = paradaFalada(choice.fala, pos).stop, dd = dist(pos, sp);
            if (dd <= CONFERE_M && sp.id < dest.id) { origin = sp; origin.dist = dd; await speak('Entendi. Você está na parada ' + nm(sp) + '. O GPS confirma, a ' + fmtD(dd) + '.'); }
            else { await speak(sp.id >= dest.id ? 'A parada ' + nm(sp) + ' fica depois do seu destino. Vou seguir pelo GPS.' : 'Você disse ' + nm(sp) + ', mas o GPS indica que você está a ' + fmtD(dd) + ' dela. Vou seguir pelo GPS.'); origin = nr.s; origin.dist = nr.d; walk = true; }
          } else if (choice === 'sim') { S.sim = true; S.modeChosen = true; setSimBanner(); await speak('Modo simulação ativado.'); origin = await askOrigin(); }
          else if (far) { await speak('Você está longe demais da linha para eu acompanhar pelo GPS. Quando estiver perto de uma parada, é só pedir de novo.'); continue; }
          else { origin = nr.s; origin.dist = nr.d; walk = true; }
        } else { origin = nr.s; origin.dist = nr.d; }
      }
    }
    if (S.sim) S.lastSimStop = origin;
    if (dest.id <= origin.id) { await speak('Essa parada fica para trás. A linha 875C-10 só vai do Terminal Lapa ao Metrô Santa Cruz. Vamos escolher o destino de novo.'); continue; }
    const mins = Math.max(1, Math.round((dest.id - origin.id) * minPorParada()));
    S.vdata = { dest: nm(dest), from: nm(origin), mins };
    const ok = await ask('Entendi. Você quer ir para ' + nm(dest) + ', pela linha 875C-10. ' + (walk ? 'O ponto mais próximo é ' + nm(origin) + ', a ' + fmtD(origin.dist) + ' de você. Vou te guiar até lá antes de começar. ' : 'Saindo de ' + nm(origin) + (!S.sim && origin.dist != null ? ', a ' + fmtD(origin.dist) + ' de você' : '') + '. ') + 'Cerca de ' + mins + ' minutos de ônibus, é uma estimativa. Está correto? Diga sim ou não.', n => /\b(corrigir|corrige|errado|nao|voltar)\b/.test(n) ? false : /\b(confirmar|confirmo|confirma|sim|certo|isso|ok|pode)\b/.test(n) ? true : undefined, { view: 'confirm', again: 'Está correto? Diga sim ou não.' });
    if (!ok) { prompt = 'Certo. Para onde você quer ir?'; continue; }
    return { origin, dest, walk };
  }
}


/* ---------- introdução até o ponto: guia a pé quando o usuário está a mais de 100 m da parada ---------- */
function bearing(a, b) { const r = x => x * Math.PI / 180, y = Math.sin(r(b.lng - a.lng)) * Math.cos(r(b.lat)), x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lng - a.lng)); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }
const CARD = ['norte', 'nordeste', 'leste', 'sudeste', 'sul', 'sudoeste', 'oeste', 'noroeste'];
function walkDir(w, pos) {
  const tb = bearing(pos, w.stop);
  if (w.heading == null) return 'O ponto fica ao ' + CARD[Math.round(tb / 45) % 8] + ' de você. Comece a andar para eu saber para que lado você vai.';
  const diff = ((tb - w.heading + 540) % 360) - 180;
  if (Math.abs(diff) < 30) return 'Siga em frente.';
  if (Math.abs(diff) > 150) return 'O ponto está atrás de você. Dê meia-volta.';
  return diff > 0 ? 'Vire à direita.' : 'Vire à esquerda.';
}
async function walkToStop(stop) {
  const w = S.walk = { stop, heading: null, prev: null, bucket: null, best: null, d: null, d0: null, dir: '', phase: 'run', last: '', done: null };
  const finished = new Promise(r => w.done = r); let watch = null, busy = false;
  mainHandler = async alts => { if (busy) return; busy = true; try {
    for (const a of alts) { const m = norm(a);
      if (/\b(sair|cancelar|encerrar|desistir)\b/.test(m)) { w.phase = 'done'; clearTrip(); await speak('Caminhada cancelada.'); w.done('cancel'); return; }
      if (RE_SIM_ON.test(m)) { S.sim = true; S.modeChosen = true; setSimBanner(); w.phase = 'done'; clearTrip(); await speak('Modo simulação ativado.'); w.done('cancel'); return; }
      if (RE_PREV.test(m)) { await speak(await previsaoTexto(stop)); return; }
      if (/\b(repetir|repete|onde estou|ajuda)\b/.test(m)) { await speak(w.last || 'Ainda estou calculando onde você está.'); return; }
    } sound('err'); } finally { busy = false; } };
  const say = txt => { w.last = txt; return speak(txt); };
  const onPos = async c => {
    if (w.phase !== 'run') return;
    const pos = { lat: c.latitude, lng: c.longitude }, d = dist(pos, stop);
    if (w.prev && dist(w.prev, pos) >= 5) { w.heading = bearing(w.prev, pos); w.prev = pos; } else if (!w.prev) w.prev = pos;
    w.d = d; if (w.d0 == null) w.d0 = d; w.dir = walkDir(w, pos);
    if (S.view === 'walk') show('walk');
    if (d <= Math.max(25, (c.accuracy || 0))) { w.phase = 'done'; sound('arrive'); notify('GuIa', 'Você chegou ao ponto: ' + nm(stop));
      await say('Você chegou ao ponto ' + nm(stop) + '. Fique na calçada, longe da guia, e aguarde o ônibus. Prepare-se para embarcar.'); w.done('arrived'); return; }
    const b = Math.floor(d / 20);
    if (w.bucket == null) w.bucket = b;
    if (w.best == null || d < w.best) w.best = d;
    if (b < w.bucket) { w.bucket = b; sound('pass'); await say('Faltam cerca de ' + pl(Math.round(d / 10) * 10, 'metro', 'metros') + '. ' + w.dir); }
    else if (d > w.best + 30) { w.best = d; w.bucket = b; await say('Você está se afastando do ponto. Faltam cerca de ' + pl(Math.round(d / 10) * 10, 'metro', 'metros') + '. ' + w.dir); }
  };
  show('walk');
  watch = navigator.geolocation.watchPosition(p => onPos(p.coords), e => { if (e.code === 1) { w.phase = 'done'; speak('A permissão de localização foi retirada.'); w.done('cancel'); } }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  w.d = stop.dist != null ? stop.dist : null; w.d0 = w.d;
  await say((stop.dist != null ? 'Você não está no ponto. Vou te guiar até o ponto ' + nm(stop) + ', a ' + fmtD(stop.dist) + ' de você.' : 'Retomando a caminhada até o ponto ' + nm(stop) + '.') + (S.lastPos0 ? ' O ponto fica ao ' + CARD[Math.round(bearing(S.lastPos0, stop) / 45) % 8] + ' de você.' : '') + ' As indicações são em linha reta, então preste atenção ao entorno e use sua bengala ou cão-guia. Aviso a cada 20 metros.');
  const r = await finished;
  if (watch != null) navigator.geolocation.clearWatch(watch);
  mainHandler = null; S.walk = null; return r;
}


/* ---------- memória de trajeto: o progresso fica salvo até a viagem ser concluída ou cancelada ---------- */
function saveTrip(o) { store.set('trip', { origin: o.origin, dest: o.dest, idx: o.idx, sim: !!o.sim, phase: o.phase || 'ride', t: Date.now() }); }
function clearTrip() { store.del('trip'); }
function validTrip() {
  const s = store.get('trip'); if (!s) return null;
  const ok = x => Number.isInteger(x) && x >= 1 && x <= STOPS.length;
  if (!ok(s.origin) || !ok(s.dest) || !Number.isInteger(s.idx) || s.idx < 0 || s.idx > STOPS.length - 1 || s.dest <= s.origin) { clearTrip(); return null; }
  if (s.phase === 'ride' && s.idx >= s.dest - 1) { clearTrip(); return null; } /* já chegou: nada a retomar */
  return s;
}
async function offerResume(greet, s) {
  const dest = STOPS[s.dest - 1], cur = STOPS[s.idx], org = STOPS[s.origin - 1];
  const where = s.phase === 'walk' ? 'caminhando até o ponto ' + nm(org) : 'na parada ' + nm(cur);
  const yes = await ask((greet ? greet + ' ' : '') + 'Notei que você interrompeu um trajeto. Você estava indo para ' + nm(dest) + ', ' + where + '. Quer continuar de onde parou? Diga sim ou não.', yn, { noGlobal: true });
  if (!yes) clearTrip();
  return yes;
}


/* ---------- posição = o que você fala + o GPS (um completa o outro) ---------- */
const RE_ESTOU = /\b(estou|estamos|me encontro|to (na|no|em|aqui|perto)|tou (na|no|em|aqui|perto))\b/;
const CONFERE_M = 300; /* até 300 m de diferença entre a fala e o GPS: considera que confere */
/** Entende a parada falada. Se a fala serve para várias (ex.: "Faria Lima"), o GPS escolhe a mais perto de você. */
function paradaFalada(texto, pos) {
  const r = reconhecerParada(texto);
  if (r.tipo === 'direta' || r.tipo === 'confirmar') return { stop: r.parada };
  if (r.tipo === 'ambigua') {
    if (pos) { let b = null; r.paradas.forEach(s => { const d = dist(pos, s); if (!b || d < b.d) b = { s, d }; }); return { stop: b.s, porGps: true }; }
    return { ambigua: r.paradas };
  }
  return {};
}
/** Aplica a parada informada à viagem em andamento. No GPS real só avança; na simulação (livre) a sua fala manda e pode avançar ou voltar. */
async function aplicarParada(n, s, intro, livre) {
  if (s.id > n.dest.id) { await speak('Essa parada fica depois do seu destino, ' + nm(n.dest) + '.'); return; }
  if (livre && s.id < n.origin.id) { await speak('Essa parada fica antes do seu ponto de embarque, ' + nm(n.origin) + '.'); return; }
  if (!livre && s.id - 1 < n.idx) { await speak('Você já passou pela parada ' + nm(s) + '. A última registrada foi ' + nm(STOPS[n.idx]) + '.'); return; }
  if (s.id === n.dest.id) { clearTimeout(n.timer); n.idx = n.dest.id - 2; await speak(intro); await step(n, false); return; }
  if (livre ? s.id - 1 !== n.idx : s.id - 1 > n.idx) { n.idx = s.id - 1; n.tok++; saveTrip({ origin: n.origin.id, dest: n.dest.id, idx: n.idx, sim: n.sim }); S.ans = null; drawTrip(); }
  clearTimeout(n.timer);
  const l = n.dest.id - STOPS[n.idx].id;
  await speak(intro + ' Faltam ' + pl(l, 'parada', 'paradas') + ' até ' + nm(n.dest) + '.');
  if (l === 1 && n.phase !== 'done') await avisar(n, 'preparacao', n.dest, msgPreparacao(n)); /* posição corrigida por voz para a penúltima: prepara o desembarque */
  if (n.sim && !n.paused && n.phase !== 'done') schedule(n);
}
/** "Estou na Rua Roma": junta o que você disse com o GPS. */
async function posicaoFalada(n, m) {
  let f = paradaFalada(m, n.sim ? null : n.lastPos);
  if (f.ambigua) { const lista = f.ambigua.slice(0, 5); const s = await ask('Em qual parada você está? ' + listaFalada(lista) + '?', (x, raw) => escolherEntre(raw || x, lista) || undefined, { noGlobal: true, view: 'keep', again: 'Diga o nome ou o número da parada.' }); f = { stop: s }; }
  if (!f.stop) { await speak('Não entendi em que parada você está.'); return true; }
  const s = f.stop;
  if (n.sim) { await aplicarParada(n, s, 'Entendi. Você está na parada ' + nm(s) + '.', true); return true; } /* simulação: acredita no que você fala, para frente ou para trás */
  if (s.id > n.dest.id || s.id - 1 < n.idx) { await aplicarParada(n, s, ''); return true; } /* já passou ou fica depois do destino: nem precisa perguntar */
  if (!n.lastPos) { await aplicarParada(n, s, 'Ainda sem sinal de GPS, então vou usar o que você falou. Você está na parada ' + nm(s) + '.'); return true; }
  const d = dist(n.lastPos, s);
  if (d <= CONFERE_M) { await aplicarParada(n, s, 'Entendi. Você está na parada ' + nm(s) + (f.porGps ? ', a mais próxima de você pelo GPS' : '. O GPS confirma, a ' + fmtD(d)) + '.'); return true; }
  const g = n.lastNearAll;
  const quem = await ask('Você disse ' + nm(s) + ', mas o GPS indica que você está a ' + fmtD(g.d) + ' da parada ' + nm(g.s) + ' e a ' + fmtD(d) + ' da que você falou. Em qual devo confiar? Diga eu falei, ou GPS.',
    x => /\b(gps|localizacao|sistema)\b/.test(x) ? 'gps' : /\b(eu falei|falei|eu disse|disse|o que falei|minha fala)\b/.test(x) ? 'fala' : undefined, { noGlobal: true, view: 'keep', again: 'Diga eu falei, ou GPS.' });
  if (quem === 'fala') await aplicarParada(n, s, 'Certo. Vou usar a parada que você falou, ' + nm(s) + '.');
  else await speak('Certo. Continuo pelo GPS.');
  return true;
}

/* ---------- espera pelo ônibus (SIMULAÇÃO): aviso de chegada por voz, som e vibração ----------
   Tudo aqui é simulado e dito como simulado: não existe ligação com dados reais de chegada do ônibus nesta etapa. */
const RE_QUANTO = /\b(quanto (tempo )?falta|quanto falta|quando chega|ja chegou)\b/;
const HELP_BUS = 'Você pode dizer: quanto falta, para ouvir a previsão simulada. Repetir. Avançar, para pular a espera na simulação. Parar, para pausar. Continuar. Ou sair, para encerrar. Em emergência, repita sua palavra-chave duas vezes em até quatro segundos, ou diga preciso de ajuda.';
function busStatus(b) {
  if (b.ph === 'here') return 'O ônibus simulado já chegou. Confirme a linha com o motorista e cuidado com o degrau ao subir.';
  return 'Previsão simulada: o ônibus chega em cerca de ' + pl(Math.max(1, Math.ceil(b.left)), 'minuto', 'minutos') + '. Lembrando que é uma simulação, não são dados reais do ônibus.';
}
const busMsgFar = stop => 'Seu ônibus, linha ' + BUS.linha + ', sentido ' + BUS.sentido + ', está chegando ao ponto ' + nm(stop) + '. Previsão simulada de chegada: ' + pl(BUS.minutos, 'minuto', 'minutos') + '. O intervalo simulado entre os ônibus desta linha é de ' + BUS.intervalo + ' minutos. Esta previsão é simulada, não são dados reais do ônibus. Preste atenção ao ponto de embarque. Ao subir, cuidado com o degrau e segure no corrimão.';
/* Instruções de embarque e de viagem: as mesmas na simulação e no modo real. */
const INSTR_EMBARQUE = 'Confirme com o motorista se é a linha ' + BUS.linha + ', sentido ' + BUS.sentido + '. Espere o ônibus parar completamente e as pessoas descerem. Ao subir, cuidado com o degrau e segure no corrimão. Passe o bilhete no validador.';
const INSTR_DENTRO = 'Procure um assento, de preferência perto da porta, ou segure firme no corrimão. Eu aviso cada parada e quando faltar pouco para descer, e então você aperta o botão de parada. Para saber quanto falta, diga quanto falta.';
const duracaoMin = l => Math.max(1, Math.round(l * minPorParada()));
const tempoViagem = l => pl(l, 'parada', 'paradas') + ', cerca de ' + pl(duracaoMin(l), 'minuto', 'minutos');
const busMsgNear = () => 'Seu ônibus está quase chegando. Previsão simulada: cerca de 1 minuto. Prepare-se para embarcar, fique na calçada longe da guia e tenha cuidado ao subir o degrau.';
const busMsgHere = () => 'Seu ônibus chegou. ' + INSTR_EMBARQUE + ' Lembrete: isto é uma simulação, o ônibus não é real.';
/* ---------- simulação: guia até o ponto (a posição é simulada; a pessoa não precisa andar) ---------- */
const CAMINHADA = { metros: 120, passoM: 20, segPasso: 3 };
const ROTEIRO_CAMINHADA = ['Siga em frente.', 'Siga em frente.', 'Vire à direita.', 'Siga em frente.', 'Atenção ao cruzamento: pare, escute o trânsito e só atravesse quando for seguro.', 'Siga em frente.'];
const HELP_CAMINHADA = 'Você pode dizer: quanto falta, para ouvir a previsão do ônibus. Repetir. Avançar, para chegar logo ao ponto na simulação. Parar, para pausar. Continuar. Ou sair, para encerrar.';
async function walkSim(stop) {
  const w = S.walk = { stop, sim: true, d: CAMINHADA.metros, d0: CAMINHADA.metros, dir: 'Siga em frente.', phase: 'run', paused: false, busy: false, last: '', done: null, n: 0 };
  const finished = new Promise(r => w.done = r); let over = false, hbusy = false, t = null;
  const say = txt => { w.last = txt; return speak(txt); };
  const finish = r => { if (over) return; over = true; clearInterval(t); w.phase = 'done'; w.done(r); };
  const chegar = async () => {
    w.d = 0; w.busy = true; w.phase = 'arrived'; if (S.view === 'walk') show('walk'); sound('arrive');

const ESPERA = { pollMs: 30000 };

/** Devolve 'ok' (pessoa disse que embarcou) ou 'cancel'. */
async function busArrivalSim(trip) {

      if (/\b(parar|pare|pausar|pausa|espera|aguarde)\b/.test(m)) { b.paused = true; await say('Contagem simulada pausada. Diga continuar para seguir.'); return; }

/* ---------- ciclo principal ---------- */
async function mainLoop(first, saved, greet) {

    let trip;

    }

    first = null;
