*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;font-size:17px;line-height:1.4}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.phone{width:100%;height:100dvh;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:background .25s}
@media (min-width:560px){.stage{padding:24px}.phone{width:414px;height:min(868px,calc(100dvh - 48px));min-height:640px;border-radius:56px;border:12px solid var(--bezel);box-shadow:0 8px 24px rgba(29,3,40,.18)}}
.phone.tone-yellow{--bg:var(--yellow);--text:var(--navy);--muted:#1e2a4a;--btn-bg:var(--navy);--btn-fg:#fff;--surface:rgba(10,26,64,.1);--line:rgba(10,26,64,.35);--accent:var(--navy)}
.phone.tone-mint{--bg:var(--mint);--text:var(--navy);--muted:#12294f;--btn-bg:var(--navy);--btn-fg:#fff;--surface:rgba(10,26,64,.1);--line:rgba(10,26,64,.35);--accent:var(--navy);--ok:var(--navy)}
.view{flex:1;display:flex;flex-direction:column;gap:16px;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;min-height:0}
.grow{flex:1;min-height:4px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sim{margin:0;padding:8px 14px;border:2px dashed var(--accent);border-radius:16px;font-weight:600;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.gl{font-weight:500;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.pill .ic{font-size:18px}
.eq{display:inline-flex;gap:3px;align-items:center;height:16px}
.eq i{width:3px;background:currentColor;border-radius:2px;height:6px}

@keyframes eq{50%{height:16px}}

.c{text-align:center}
.sub{margin:0;color:var(--muted);font-size:18px}
.strong{color:var(--text);font-weight:600;font-size:20px}
.lbl{margin:0;font-weight:600;font-size:16px;color:var(--muted)}

.mic{position:relative;width:min(46vw,190px);aspect-ratio:1;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;margin:8px auto;flex:none}
.mic .ic{font-size:64px}
.mic::before,.mic::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:3px solid var(--line);opacity:.9}

.btn .ic{font-size:24px}
.acts{display:flex;flex-direction:column;gap:10px}
.fine{margin:0;text-align:center;font-size:14px;color:var(--ok);font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.tip{border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px}.tip b{display:block}
.badge-top{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--btn-bg);color:var(--yellow);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.head{display:flex;gap:14px;align-items:center}

.head h1{margin:0;font-weight:800;font-size:clamp(26px,7.4vw,32px);line-height:1.05}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;display:flex;gap:14px;align-items:center;padding:0 0 22px;min-height:46px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:15px;top:32px;bottom:-4px;border-left:3px dotted var(--line)}
.tl li.done::before{border-left:3px solid var(--ok)}
.tl li:last-child::before{display:none}
.node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);border:3px solid var(--line);position:relative;z-index:1}
.node.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}

.node.pin{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);border-radius:10px}
.node .ic{font-size:18px}
.tl b{display:block;font-size:17px;font-weight:700;line-height:1.25}.tl small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}

.tone-yellow .big-badge{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.04)}}
</style>

    const dest = await askStop(prompt, 'Para onde você deseja ir?'); prompt = 'Para onde você deseja ir?';
    if (dest.id === 1) { await speak('O Terminal Lapa é o ponto inicial da linha. Só tenho o sentido Terminal Lapa para Metrô Santa Cruz. Escolha outro destino.'); continue; }
    let origin = null; const askOrigin = () => askStop('Onde você está agora?', 'Onde você está agora?');
    if (S.sim) origin = await askOrigin();
    else {
      await speak('Estou identificando sua localização.');
      let pos = null; try { pos = await getPos(20000); S.geoOK = true; } catch (e) {}
      if (!pos) { if (await offerSim()) origin = await askOrigin(); else continue; }
      else {
        const nr = nearest(pos, 0, Math.max(0, dest.id - 2));
        if (nr.d > 2500) { await speak('Você está a ' + fmtD(nr.d) + ' da linha 875C-10.'); if (await offerSim()) origin = await askOrigin(); else continue; }
        else { origin = nr.s; origin.dist = nr.d; }
      }
    }
    if (dest.id <= origin.id) { await speak('Essa parada fica para trás. A linha 875C-10 só vai do Terminal Lapa ao Metrô Santa Cruz. Vamos escolher o destino de novo.'); continue; }
    const mins = Math.max(1, Math.round((dest.id - origin.id) * 1.83));
    S.vdata = { dest: nm(dest), from: nm(origin), mins };
    const ok = await ask('Entendi: ' + nm(dest) + ', pela linha 875C-10, saindo de ' + nm(origin) + (!S.sim && origin.dist != null ? ', a ' + fmtD(origin.dist) + ' de você' : '') + '. Cerca de ' + mins + ' minutos, é uma estimativa. Diga confirmar ou corrigir.', n => /\b(corrigir|corrige|errado|nao|voltar)\b/.test(n) ? false : /\b(confirmar|confirmo|confirma|sim|certo|isso|ok|pode)\b/.test(n) ? true : undefined, { view: 'confirm', again: 'Diga confirmar ou corrigir.' });
    if (!ok) { prompt = 'Certo. Para onde você quer ir?'; continue; }
    return { origin, dest };
  }
}

/* ---------- viagem: simulação e GPS real, comandos por voz ---------- */
const NAV_MS = 5000;
function drawTrip() { if (S.nav) setTrip(); }
function passMsg(s, l, n) {
  const nx = STOPS[s.id], d = dist(s, nx);
  if (l === 1) return 'Atenção: desça na próxima parada, ' + nm(n.dest) + '. Passando pela parada ' + nm(s) + '. Falta 1 parada.';
  return 'Atenção: passando pela parada ' + nm(s) + '. Faltam ' + pl(l, 'parada', 'paradas') + '. Próxima: ' + nm(nx) + ', a ' + fmtD(d) + '.';
}
async function arrive(n) {
  const my = n.tok = (n.tok || 0) + 1; clearTimeout(n.timer); n.phase = 'done'; sound('arrive'); notify('GuIa', 'Você chegou: ' + nm(n.dest));
  show('arrive', { dest: nm(n.dest), sim: n.sim });
  await speak('Você chegou ao seu destino: ' + nm(n.dest) + '.' + (n.dest.id === 46 ? ' Fim da linha.' : '') + (n.sim ? ' Fim da simulação.' : '')); n.done('arrived');
}
async function step(n, manual) {
  if (n.phase === 'done') return;
  n.idx++; const s = STOPS[n.idx], l = n.dest.id - s.id; const my = ++n.tok; n.count++;
  if (l <= 0) return arrive(n);
  sound(l === 1 ? 'near' : 'pass'); if (l === 1) notify('GuIa', 'Desça na próxima parada: ' + nm(n.dest));
  S.ans = null; drawTrip(); let msg = passMsg(s, l, n); if (n.sim && n.count % 6 === 0) msg += ' Lembrete: você está no modo simulação.';
  await speak(msg);
  if (my === n.tok && n.sim && !n.paused) schedule(n);
}
function schedule(n) { clearTimeout(n.timer); const my = n.tok; n.timer = setTimeout(() => { if (my === n.tok && !n.paused && n.phase !== 'done') step(n, false); }, NAV_MS); }
async function watchTick(n, c) {
  if (n.paused || n.phase === 'done') return;
  const pos = { lat: c.latitude, lng: c.longitude }, nr = nearest(pos, n.idx, n.dest.id - 1);
  n.lastPos = pos; n.lastNear = nr;
  if (nr.i > n.idx && nr.d <= Math.max(90, (c.accuracy || 0) * 1.2)) { n.idx = nr.i - 1; await step(n, false); }
  else if (!n.nearSaid && n.dest.id - 1 > n.idx && dist(pos, n.dest) <= 150) { n.nearSaid = true; sound('near'); await speak('Você está chegando em ' + nm(n.dest) + '. Prepare-se para desembarcar.'); }
  if (dist(pos, n.dest) <= 50 && n.phase !== 'done') { n.idx = n.dest.id - 2; await step(n, false); }
}
function where(n) { const s = STOPS[n.idx], l = n.dest.id - s.id; return 'Você está na parada ' + s.id + ', ' + nm(s) + '. Faltam ' + pl(l, 'parada', 'paradas') + ' até ' + nm(n.dest) + '.' + (n.sim ? ' Atenção: você está no modo simulação.' : ''); }
const HELP = 'Você pode dizer: avançar, para pular uma parada na simulação. Parar, para pausar. Continuar. Onde estou. Próxima parada. Repetir. Para onde vou. Modo real, ou ativar simulação. Ou sair, para encerrar a viagem.';
async function reply(n, text) { S.ans = { q: n.asked || '', a: text }; if (S.view === 'route' || S.view === 'near') show(S.view); await speak(text); }
async function navCmd(n, c) {
  const m = c;
  if (/\b(sair|encerrar|cancelar viagem|cancelar rota|terminar)\b/.test(m) && !RE_SIM_OFF.test(m)) { clearTimeout(n.timer); n.phase = 'done'; n.tok++; await speak('Viagem encerrada.'); n.done('cancel'); return true; }
  if (RE_SIM_OFF.test(m)) { clearTimeout(n.timer); n.phase = 'done'; n.tok++; S.sim = false; S.modeChosen = true; setSimBanner(); await speak('Modo simulação desativado. Usando localização real.'); n.done('cancel'); return true; }
  if (/\bajuda\b/.test(m)) { await reply(n, HELP); return true; }
  if (/\b(onde estou|onde eu estou)\b/.test(m)) { await reply(n, where(n)); if (!n.sim && n.lastNear) await speak('O GPS indica a parada mais próxima a ' + fmtD(n.lastNear.d) + '.'); return true; }
  if (/\b(para onde vou|destino)\b/.test(m)) { await reply(n, 'Seu destino é ' + nm(n.dest) + ', parada ' + n.dest.id + '. Faltam ' + pl(n.dest.id - STOPS[n.idx].id, 'parada', 'paradas') + '.'); return true; }
  if (/\bproxima parada\b|\bproximo ponto\b/.test(m)) { const nx = STOPS[Math.min(n.idx + 1, 45)], d = dist(n.lastPos || STOPS[n.idx], nx); await reply(n, 'Próxima parada: ' + nm(nx) + '. Distância aproximada: ' + fmtD(d) + '.'); return true; }
  if (/\b(repetir|repete|ouvir de novo)\b/.test(m)) { await reply(n, S.lastNavMsg || where(n)); return true; }
  if (/\b(avancar|avanca|pular)\b/.test(m)) { if (!n.sim) { await speak('Avançar só funciona na simulação. Na localização real, eu acompanho pelo GPS.'); return true; } clearTimeout(n.timer); await step(n, true); return true; }
  if (/\b(parar|pare|pausar|pausa|espera|aguarde)\b/.test(m)) { n.paused = true; n.tok++; clearTimeout(n.timer); drawTrip(); await speak('Pausado na parada ' + nm(STOPS[n.idx]) + '. Diga continuar para seguir' + (n.sim ? ', ou avançar para pular uma parada.' : '.')); return true; }
  if (/\b(continuar|continua|retomar|prosseguir|seguir)\b/.test(m)) { if (n.paused) { n.paused = false; n.tok++; drawTrip(); await speak('Retomando. Você está na parada ' + nm(STOPS[n.idx]) + '.'); if (n.sim) schedule(n); } else await speak('A viagem já está em andamento.'); return true; }
  if (RE_SIM_ON.test(m)) { if (n.sim) await speak('A simulação já está ativa.'); else await speak('Para simular, encerre esta viagem dizendo sair e depois diga simulação.'); return true; }
  return false;
}
async function runTrip(t) {
  const n = S.nav = { origin: t.origin, dest: t.dest, idx: t.origin.id - 1, paused: false, tok: 0, sim: S.sim, timer: null, count: 0, phase: 'run', nearSaid: false };
  const finished = new Promise(r => n.done = r); let watch = null, busy = false, wl = null;
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wl = l, () => {}); } catch (e) {}
  mainHandler = async alts => { if (busy) return; busy = true; n.asked = alts[0]; try { for (const a of alts) { if (await navCmd(n, norm(a))) return; } sound('err'); } finally { busy = false; } };
  const L = t.dest.id - t.origin.id; S.ans = null; drawTrip();
  if (n.sim) {
    await speak('Perfeito. Simulando o trajeto da linha 875C-10 até ' + nm(t.dest) + '. Você está na parada ' + nm(t.origin) + '. Faltam ' + pl(L, 'parada', 'paradas') + ' até o destino. Atenção: você está no modo simulação.');
    schedule(n);
  } else {
    watch = navigator.geolocation.watchPosition(p => watchTick(n, p.coords), e => { if (e.code === 1) { n.paused = true; speak('A permissão de localização foi retirada. Diga modo real quando liberar, ou ativar simulação.'); } }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    await speak('Navegação iniciada até ' + nm(t.dest) + ', linha 875C-10. Faltam ' + pl(L, 'parada', 'paradas') + '. Eu aviso cada parada pelo GPS. Diga ajuda para ouvir os comandos.');
  }
  const r = await finished;
  clearTimeout(n.timer); if (watch != null) navigator.geolocation.clearWatch(watch); try { wl && wl.release(); } catch (e) {}
  mainHandler = null; S.nav = null; S.ans = null;
  return r;
}

/* ---------- ciclo principal ---------- */
async function mainLoop(first) {
  for (;;) {
    const trip = await planTrip(first); first = null;
    await runTrip(trip); /* a tela de chegada fica visível durante a pergunta */
    const again = await ask('Quer fazer uma nova viagem? Diga novo destino, ou encerrar guia.', n => /\b(encerrar|encerra|nao|sair|fim)\b/.test(n) ? false : /\b(novo|nova|outro|outra|sim|quero|destino)\b/.test(n) ? true : undefined, { view: 'keep' });
    if (!again) await ask('Tudo bem. Estou ouvindo. Diga Para onde vou, quando quiser ir a algum lugar.', n => /\b(para onde|destino|viagem|ir|quero|guia|comecar)\b/.test(n) ? true : undefined, { wait: 45000 });
    first = 'Para onde você gostaria de ir?';
  }
}
/* Ao abrir, já começa: verifica perfil e permissões em silêncio e fala na hora. Sem pergunta de permissão, sem "Diga Começar". */
async function boot() {
  show('say'); setState('idle');
  if (!SR) { setCaption('Este navegador não tem reconhecimento de voz. Abra o GuIa no Chrome.'); await speak('Este navegador não tem reconhecimento de voz. Abra o Guia no Chrome do Android ou do computador.'); return; }
  const profile = store.get('profile');
  if (prefs.vib === undefined) prefs.vib = true;
  if (prefs.notif === undefined) prefs.notif = false;
  const [mic, geo] = await Promise.all([permState('microphone'), permState('geolocation')]);
  if (mic === 'granted') { S.micOK = true; startRec(); }
  if (geo === 'granted') S.geoOK = true;
  const micReq = S.micOK ? Promise.resolve(true) : requestMic(); /* o aviso do navegador aparece enquanto o Guia já está falando */
  const hello = profile ? 'Bem-vindo de volta, ' + profile.name + '. Estou ouvindo.' : 'Bem-vindo ao Guia. Estou ouvindo.';
  let spoke = false;
  if (!S.micOK) { await speak(hello); spoke = true; if (!(await micReq)) await ensureMic(); show('say'); }
  sound('ok');
  /* localização: pedida ao navegador em segundo plano; se for negada, o Guia oferece a simulação só quando for preciso */
  if (!S.geoOK && navigator.geolocation) getPos(20000).then(() => { S.geoOK = true; }, () => {});
  if (profile) return mainLoop(spoke ? 'Para onde você gostaria de ir hoje?' : hello + ' Para onde você gostaria de ir hoje?');
  if (!spoke) await speak(hello);
  await register();
  return mainLoop('Para onde você deseja ir?');
}
window.addEventListener('load', () => boot().catch(e => { console.error(e); setCaption('Algo falhou. Recarregue a página.'); }));
window.Guia = { S, STOPS, deliver, findStops, store, speak, show, setState };
</script>
