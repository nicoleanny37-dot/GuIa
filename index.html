  const n = S.nav = { origin: t.origin, dest: t.dest, idx: rs ? rs.idx : t.origin.id - 1, paused: false, tok: 0, sim: rs ? !!rs.sim : S.sim, timer: null, count: 0, phase: 'run', nearSaid: false };
  const finished = new Promise(r => n.done = r); let watch = null, busy = false, wl = null;
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wl = l, () => {}); } catch (e) {}
  mainHandler = async alts => { if (busy) return; busy = true; n.asked = alts[0]; try { for (const a of alts) { if (await navCmd(n, norm(a))) return; } sound('err'); } finally { busy = false; } };
  const L = t.dest.id - (n.idx + 1); S.ans = null; saveTrip({ origin: n.origin.id, dest: n.dest.id, idx: n.idx, sim: n.sim }); drawTrip();
  if (n.sim && rs) {
    await speak('Retomando o trajeto até ' + nm(t.dest) + '. Você está na parada ' + nm(STOPS[n.idx]) + '. Faltam ' + pl(L, 'parada', 'paradas') + ' até o destino. Atenção: você está no modo simulação.');
    schedule(n);
  } else if (n.sim) {
    await speak('Perfeito. Simulando o trajeto da linha 875C-10 até ' + nm(t.dest) + '. Você está na parada ' + nm(t.origin) + '. Faltam ' + pl(L, 'parada', 'paradas') + ' até o destino. Atenção: você está no modo simulação.');
    schedule(n);
  } else {
    watch = navigator.geolocation.watchPosition(p => watchTick(n, p.coords), e => { if (e.code === 1) { n.paused = true; speak('A permissão de localização foi retirada. Diga modo real quando liberar, ou ativar simulação.'); } }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    await speak(rs ? 'Retomando o trajeto até ' + nm(t.dest) + '. Você estava na parada ' + nm(STOPS[n.idx]) + '. Faltam ' + pl(L, 'parada', 'paradas') + '. Eu aviso cada parada pelo GPS.' : 'Navegação iniciada até ' + nm(t.dest) + ', linha 875C-10. Faltam ' + pl(L, 'parada', 'paradas') + '. Eu aviso cada parada pelo GPS. Diga ajuda para ouvir os comandos.');
  }
  const r = await finished;
  clearTimeout(n.timer); if (watch != null) navigator.geolocation.clearWatch(watch); try { wl && wl.release(); } catch (e) {}
  mainHandler = null; S.nav = null; S.ans = null;
  return r;
}

/* ---------- ciclo principal ---------- */
async function mainLoop(first, saved, greet) {
  for (;;) {
   try {
    let trip;
    if (saved) {
      const s = saved; saved = null;
      if (await offerResume(greet, s)) {
        S.sim = !!s.sim; S.modeChosen = true; setSimBanner();
        trip = { origin: STOPS[s.origin - 1], dest: STOPS[s.dest - 1], walk: s.phase === 'walk', resume: s.phase === 'ride' ? s : null };
        if (trip.walk) { trip.origin.dist = null; }
      } else first = 'Tudo bem. O trajeto anterior foi descartado. Para onde você gostaria de ir hoje?';
    }
    if (!trip) { trip = await planTrip(first); }
    first = null;
    if (trip.walk) {
      saveTrip({ origin: trip.origin.id, dest: trip.dest.id, idx: trip.origin.id - 1, sim: false, phase: 'walk' });
      const r = await walkToStop(trip.origin); if (r !== 'arrived') { clearTrip(); first = 'Para onde você gostaria de ir?'; continue; }
    }
    const fim = await runTrip(trip); /* a tela de chegada fica visível durante a pergunta */
    if (S.sim) { S.sim = false; S.modeChosen = false; setSimBanner(); if (fim === 'cancel') await speak('Voltando ao modo real.'); } /* a simulação não fica ligada nas próximas viagens: o padrão é o GPS real */
    const again = await ask('Quer fazer uma nova viagem? Diga novo destino, ou encerrar guia.', n => /\b(encerrar|encerra|nao|sair|fim)\b/.test(n) ? false : /\b(novo|nova|outro|outra|sim|quero|destino)\b/.test(n) ? true : undefined, { view: 'keep' });
    if (!again) await ask('Tudo bem. Estou ouvindo. Diga Para onde vou, quando quiser ir a algum lugar.', n => /\b(para onde|destino|viagem|ir|quero|guia|comecar)\b/.test(n) ? true : undefined, { wait: 45000 });
    first = 'Para onde você gostaria de ir?';
   } catch (e) { /* qualquer falha inesperada: o Guia avisa por voz e recomeça, em vez de ficar mudo */
    console.error(e); S.nav = null; S.walk = null; mainHandler = null; waiter = null; first = 'Para onde você gostaria de ir?';
    try { await speak('Tive um problema, mas já estou de volta.'); } catch (e2) {}
   }
  }
}
/* Saudação pelo horário: 05–12 bom dia, 12–18 boa tarde, 18–05 boa noite. */
function saudacao(d) { const h = (d || new Date()).getHours(); return h >= 5 && h < 12 ? 'Bom dia' : h >= 12 && h < 18 ? 'Boa tarde' : 'Boa noite'; }
/* Memória: antes de falar qualquer coisa, verifica em silêncio perfil, microfone e localização. */
async function boot() {
  show('say'); setState('idle');
  if (!SR) { setCaption('Este navegador não tem reconhecimento de voz. Abra o GuIa no Chrome.'); await speak('Este navegador não tem reconhecimento de voz. Abra o Guia no Chrome do Android ou do computador.'); return; }
  const profile = store.get('profile');
  const [mic, geo] = await Promise.all([permState('microphone'), permState('geolocation')]);
  if (mic === 'granted') { S.micOK = true; startRec(); }
  if (geo === 'granted') S.geoOK = true;
  const greet = profile ? saudacao() + ', ' + profile.name + '.' : 'Bem-vindo ao Guia.';
  if (profile && S.micOK && S.geoOK) { /* recorrente com tudo autorizado: pula cadastro e permissões */
    if (prefs.vib === undefined) prefs.vib = true; if (prefs.notif === undefined) prefs.notif = false;
    sound('ok'); const sv = validTrip();
    return sv ? mainLoop(null, sv, greet) : mainLoop(greet + ' Estou ouvindo. Para onde você gostaria de ir hoje?');
  }
  await speak(greet + ' Estou ouvindo.');
  if (!S.micOK) await ensureMic();
  if (!S.geoOK) await ensureGeo();
  await ensureExtras();
  if (!profile) await register();
  const sv2 = profile ? validTrip() : null;
  return mainLoop(profile ? 'Para onde você gostaria de ir hoje?' : 'Para onde você deseja ir?', sv2, '');
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
window.addEventListener('load', () => boot().catch(e => { console.error(e); setCaption('Algo falhou. Recarregue a página.'); }));
window.Guia = { validTrip, setDial: f => { dialFn = f; }, saudacao, E, S, STOPS, deliver, reconhecerParada, store, speak, show, setState };
</script>
